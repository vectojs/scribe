<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <title>Scribe — VectoJS Markdown Editor</title>
    <meta
      name="description"
      content="Scribe is a StackEdit-inspired markdown editor: hybrid HTML chrome with a VectoJS canvas core for source + preview."
    />
    <link
      rel="icon"
      type="image/svg+xml"
      href="https://cdn.vectojs.org/scribe/logo.svg"
    />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Scribe — VectoJS Markdown Editor" />
    <meta
      property="og:description"
      content="Hybrid HTML shell + VectoJS canvas markdown editor (StackEdit reference)."
    />
    <meta property="og:url" content="https://scribe.vectojs.org/" />
    <style>
      :root {
        --hairline: 1px;
        --header-h: 44px;
        --explorer-w: 220px;
        --settings-w: 260px;
      }

      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      html,
      body {
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #f7f4ee;
        color: #1a1a1a;
        font-family: "Inter", system-ui, sans-serif;
        -webkit-text-size-adjust: 100%;
      }

      /* DPR hairline: crisper borders on HiDPI without layout shift */
      @media (resolution: 2dppx) {
        :root {
          --hairline: 0.5px;
        }
      }
      @media (resolution: 3dppx) {
        :root {
          --hairline: 0.33px;
        }
      }

      #scribe-app {
        display: flex;
        flex-direction: column;
        width: 100%;
        height: 100vh;
        height: 100dvh;
        /* iOS Safari URL-bar: dvh already, fallback to svh for toolbar collapse */
        min-height: 0;
      }

      /* Header: 3-zone toolbar (left brand + center file + right status) */
      #scribe-header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        height: var(--header-h);
        min-height: var(--header-h);
        padding: 0 16px;
        padding-left: max(16px, env(safe-area-inset-left));
        padding-right: max(16px, env(safe-area-inset-right));
        border-bottom: var(--hairline) solid #e5ddd3;
        background: #fffdf9;
        flex-shrink: 0;
        z-index: 20;
      }

      #scribe-header-left,
      #scribe-header-right {
        display: flex;
        align-items: center;
        gap: 12px;
        min-width: 0;
      }

      #scribe-header-left {
        flex: 1 1 auto;
      }

      #scribe-header-right {
        flex-shrink: 0;
      }

      #scribe-header h1 {
        font-size: 15px;
        font-weight: 600;
        letter-spacing: -0.02em;
        flex-shrink: 0;
      }

      #scribe-header #scribe-file-name {
        font-size: 13px;
        color: #6b6256;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
        min-width: 0;
      }

      #scribe-header #scribe-save-status {
        font-size: 12px;
        color: #8a8175;
        white-space: nowrap;
      }

      /* Hamburger / settings toggles — hidden on desktop, visible in overlay */
      .scribe-icon-btn {
        display: none;
        align-items: center;
        justify-content: center;
        width: 32px;
        height: 32px;
        border: var(--hairline) solid #e5ddd3;
        border-radius: 6px;
        background: #fffdf9;
        color: #3d3529;
        font-size: 16px;
        line-height: 1;
        cursor: pointer;
        flex-shrink: 0;
        touch-action: manipulation;
        -webkit-tap-highlight-color: transparent;
      }

      .scribe-icon-btn:hover {
        background: #f7f4ee;
      }

      .scribe-icon-btn:focus-visible {
        outline: 2px solid #d97757;
        outline-offset: 2px;
      }

      #scribe-body {
        display: flex;
        flex: 1;
        min-height: 0;
        overflow: hidden;
        position: relative;
      }

      #scribe-explorer {
        width: var(--explorer-w);
        flex-shrink: 0;
        border-right: var(--hairline) solid #e5ddd3;
        background: #fffdf9;
        overflow-y: auto;
        overflow-x: hidden;
        padding: 12px 0;
        -webkit-overflow-scrolling: touch;
        overscroll-behavior: contain;
        scrollbar-gutter: stable;
      }

      #scribe-explorer h2 {
        font-size: 11px;
        font-weight: 600;
        text-transform: uppercase;
        letter-spacing: 0.06em;
        color: #8a8175;
        padding: 0 12px 8px;
      }

      #scribe-explorer ul {
        list-style: none;
      }

      #scribe-explorer li {
        padding: 6px 12px;
        font-size: 13px;
        cursor: pointer;
        border-left: 2px solid transparent;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
        touch-action: manipulation;
      }

      #scribe-explorer li[aria-selected="true"] {
        background: #fdf0e6;
        border-left-color: #d97757;
        color: #3d3529;
      }

      #scribe-explorer li:hover {
        background: #f7f4ee;
      }

      #scribe-stage {
        flex: 1;
        min-width: 0;
        position: relative;
        overflow: hidden;
        background: #f7f4ee;
        /* Ensure text selection inside projected content doesn't steal scroll on mobile */
        touch-action: pan-y;
      }

      #scribe-canvas {
        display: block;
        width: 100%;
        height: 100%;
      }

      #scribe-a11y-root {
        position: absolute;
        inset: 0;
        overflow: hidden;
        pointer-events: none;
      }

      /* Projected selectable text must remain selectable but not steal scroll */
      #scribe-a11y-root [data-vecto-content] {
        pointer-events: auto;
        touch-action: pan-y;
        user-select: text;
      }

      #scribe-settings {
        width: var(--settings-w);
        flex-shrink: 0;
        border-left: var(--hairline) solid #e5ddd3;
        background: #fffdf9;
        overflow-y: auto;
        overflow-x: hidden;
        padding: 16px;
        -webkit-overflow-scrolling: touch;
        overscroll-behavior: contain;
        scrollbar-gutter: stable;
      }

      #scribe-settings h2 {
        font-size: 12px;
        font-weight: 600;
        text-transform: uppercase;
        letter-spacing: 0.05em;
        color: #6b6256;
        margin-bottom: 12px;
      }

      #scribe-settings label {
        display: flex;
        align-items: center;
        gap: 8px;
        font-size: 13px;
        margin-bottom: 8px;
        cursor: pointer;
        touch-action: manipulation;
      }

      #scribe-settings .hint {
        font-size: 11px;
        color: #8a8175;
        margin-top: 8px;
        line-height: 1.5;
      }

      /* Backdrop for overlay drawers */
      #scribe-backdrop {
        display: none;
        position: fixed;
        inset: 0;
        top: var(--header-h);
        background: rgba(61, 53, 41, 0.32);
        backdrop-filter: blur(2px);
        -webkit-backdrop-filter: blur(2px);
        z-index: 10;
        border: none;
        padding: 0;
        cursor: pointer;
      }

      #scribe-backdrop:not([hidden]) {
        display: block;
      }

      /* ── Responsive: 900px overlay (explorer / settings become drawers) ── */
      @media (max-width: 900px) {
        .scribe-icon-btn {
          display: inline-flex;
        }

        #scribe-explorer,
        #scribe-settings {
          position: fixed;
          top: var(--header-h);
          bottom: 0;
          z-index: 15;
          max-width: 86vw;
          box-shadow: 8px 0 24px rgba(61, 53, 41, 0.12);
          transition: transform 180ms cubic-bezier(0.32, 0.72, 0, 1);
          will-change: transform;
        }

        #scribe-explorer {
          left: 0;
          transform: translateX(-100%);
          border-right: var(--hairline) solid #e5ddd3;
        }

        #scribe-explorer.is-open {
          transform: translateX(0);
        }

        #scribe-settings {
          right: 0;
          left: auto;
          transform: translateX(100%);
          border-left: var(--hairline) solid #e5ddd3;
          box-shadow: -8px 0 24px rgba(61, 53, 41, 0.12);
        }

        #scribe-settings.is-open {
          transform: translateX(0);
        }

        /* Stage takes full width when drawers are overlay */
        #scribe-stage {
          flex-basis: 100%;
        }
      }

      /* ── Responsive: 640px hamburger (toolbar collapses) ── */
      @media (max-width: 640px) {
        :root {
          --header-h: 48px;
        }

        #scribe-header {
          gap: 8px;
          padding: 0 12px;
          padding-left: max(12px, env(safe-area-inset-left));
          padding-right: max(12px, env(safe-area-inset-right));
        }

        #scribe-header h1 {
          font-size: 14px;
        }

        /* File name truncated more aggressively; save status hides to hamburger */
        #scribe-header #scribe-file-name {
          font-size: 12px;
          max-width: 38vw;
        }

        #scribe-header #scribe-save-status {
          display: none;
        }

        /* Explorer/settings narrower on small mobile for more stage */
        #scribe-explorer {
          width: 78vw;
        }

        #scribe-settings {
          width: 82vw;
        }
      }

      /* ── Breakpoint: 390px small mobile (iPhone SE) ── */
      @media (max-width: 390px) {
        #scribe-header {
          padding: 0 10px;
          padding-left: max(10px, env(safe-area-inset-left));
          padding-right: max(10px, env(safe-area-inset-right));
        }

        #scribe-header h1 {
          font-size: 13px;
        }

        #scribe-header #scribe-file-name {
          font-size: 11px;
          max-width: 32vw;
        }

        #scribe-explorer li {
          font-size: 12px;
          padding: 8px 12px;
        }

        #scribe-settings {
          padding: 12px;
        }

        #scribe-settings .hint {
          font-size: 10px;
        }
      }

      /* ── Breakpoint: 768px tablet portrait ── */
      @media (min-width: 641px) and (max-width: 768px) {
        :root {
          --explorer-w: 200px;
          --settings-w: 220px;
        }

        #scribe-explorer li {
          font-size: 12.5px;
        }
      }

      /* ── Breakpoint: 1024px small desktop ── */
      @media (min-width: 901px) and (max-width: 1024px) {
        :root {
          --explorer-w: 200px;
          --settings-w: 240px;
        }
      }

      /* ── Breakpoint: 2560px large desktop (1440p) ── */
      @media (min-width: 1920px) {
        #scribe-app {
          /* Center and cap width so 2560 doesn't stretch stage to 2k+ */
          max-width: 1920px;
          margin: 0 auto;
          border-left: var(--hairline) solid #e5ddd3;
          border-right: var(--hairline) solid #e5ddd3;
        }

        #scribe-stage {
          /* More breathing room on large canvases */
          padding: 0;
        }
      }

      @media (min-width: 2560px) {
        :root {
          --explorer-w: 260px;
          --settings-w: 300px;
        }

        #scribe-header h1 {
          font-size: 16px;
        }

        #scribe-explorer h2,
        #scribe-settings h2 {
          font-size: 12px;
        }

        #scribe-explorer li,
        #scribe-settings label {
          font-size: 14px;
        }
      }

      /* ── Touch: ensure scroll momentum preserved ── */
      @media (pointer: coarse) {
        #scribe-explorer,
        #scribe-settings {
          overscroll-behavior: contain;
          -webkit-overflow-scrolling: touch;
        }

        #scribe-explorer li {
          /* Larger tap target on touch */
          min-height: 36px;
          display: flex;
          align-items: center;
        }
      }

      /* ── Reduced motion ── */
      @media (prefers-reduced-motion: reduce) {
        #scribe-explorer,
        #scribe-settings {
          transition: none;
        }

        #scribe-backdrop {
          backdrop-filter: none;
          -webkit-backdrop-filter: none;
        }
      }

      /* ── Print: hide chrome, show stage ── */
      @media print {
        #scribe-header,
        #scribe-explorer,
        #scribe-settings,
        #scribe-backdrop {
          display: none !important;
        }

        #scribe-stage {
          overflow: visible;
        }
      }
    </style>
  </head>
  <body>
    <div id="scribe-app">
      <header id="scribe-header" aria-label="Scribe toolbar">
        <div id="scribe-header-left">
          <button
            id="scribe-menu-toggle"
            class="scribe-icon-btn"
            type="button"
            aria-label="Toggle file explorer"
            aria-expanded="false"
            aria-controls="scribe-explorer"
          >
            &#9776;
          </button>
          <h1>Scribe</h1>
          <span id="scribe-file-name" aria-live="polite">Untitled.md</span>
        </div>
        <div id="scribe-header-right">
          <span id="scribe-save-status" aria-live="polite">Saved</span>
          <button
            id="scribe-settings-toggle"
            class="scribe-icon-btn"
            type="button"
            aria-label="Toggle settings"
            aria-expanded="false"
            aria-controls="scribe-settings"
          >
            &#9881;
          </button>
        </div>
      </header>
      <div id="scribe-body">
        <nav id="scribe-explorer" aria-label="File explorer">
          <h2>Explorer</h2>
          <ul id="scribe-file-list" role="listbox" aria-label="Files">
            <li role="option" aria-selected="true">Untitled.md</li>
            <li role="option" aria-selected="false">Welcome.md</li>
            <li role="option" aria-selected="false">Notes.md</li>
          </ul>
        </nav>
        <div id="scribe-stage" aria-label="Editor stage">
          <canvas id="scribe-canvas" aria-label="Scribe editor canvas"></canvas>
          <div id="scribe-a11y-root"></div>
        </div>
        <aside id="scribe-settings" aria-label="Settings">
          <h2>Settings</h2>
          <label><input type="checkbox" checked /> Live preview</label>
          <label><input type="checkbox" checked /> Scroll sync</label>
          <p class="hint">
            Hybrid shell: outer chrome is plain HTML/CSS; center stage is
            VectoJS canvas + a11y projection.
          </p>
          <p class="hint">Add <code>?debug</code> to attach devtools.</p>
        </aside>
        <button
          id="scribe-backdrop"
          type="button"
          aria-label="Close drawers"
          hidden
        ></button>
      </div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
